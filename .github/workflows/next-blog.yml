# Writers publish by renaming src/content/blog/next-blog.md. This puts a fresh
# template back so the next post always has a file to start from.
name: Restore next-blog template

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: next-blog

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/restore-next-blog.sh
      - name: Commit the new template
        run: |
          git add src/content/blog/next-blog.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add a fresh next-blog.md template"
          git pull --rebase
          git push
